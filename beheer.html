<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Foto's beheren — Story & Shot</title>
<style>
  :root{
    --coral:#D2896A; --coral-deep:#B96A48; --cream:#F5F0E6; --dark:#18130F;
    --ink:#211A13; --ink-muted:#6E6759; --line:#E4DCCB; --white:#FFFEFB; --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    background:var(--cream); color:var(--ink); padding:32px 18px 80px;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  h1{ font-size:1.5rem; margin:0 0 6px; }
  .sub{ color:var(--ink-muted); margin:0 0 28px; font-size:.95rem; }

  .gate{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:28px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .gate input{
    flex:1 1 220px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:.95rem;
  }
  .gate button, .save-btn, .reset-btn{
    background:var(--coral); color:#fff; border:none; border-radius:8px; padding:10px 18px;
    font-size:.9rem; font-weight:600; cursor:pointer;
  }
  .gate button:hover, .save-btn:hover{ background:var(--coral-deep); }
  .reset-btn{ background:transparent; color:var(--ink-muted); border:1px solid var(--line); padding:6px 12px; font-weight:500; }
  .reset-btn:hover{ color:var(--ink); border-color:var(--ink-muted); }
  .status{ font-size:.85rem; margin-left:4px; }
  .status.ok{ color:#3d7a4f; }
  .status.err{ color:#b23; }

  fieldset{ border:none; padding:0; margin:0; }
  fieldset[disabled]{ opacity:.45; pointer-events:none; }

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:22px; display:grid; grid-template-columns:220px 1fr; gap:22px;
  }
  @media (max-width:600px){ .card{ grid-template-columns:1fr; } }

  .preview-frame{
    aspect-ratio:4/5; border-radius:10px; overflow:hidden; background:
      radial-gradient(circle at 70% 25%, rgba(210,137,106,.35), transparent 45%),
      linear-gradient(200deg, #241A10, #18130F 65%);
    position:relative;
  }
  .preview-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-frame .empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:16px; font-size:.8rem; color:#cfc7ba;
  }

  .controls h2{ font-size:1.02rem; margin:0 0 4px; }
  .controls .fname{ font-size:.8rem; color:var(--ink-muted); margin:0 0 14px; font-family:monospace; }
  .slider-row{ margin-bottom:14px; }
  .slider-row label{ display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:4px; }
  .slider-row output{ color:var(--coral-deep); font-weight:600; }
  .slider-row input[type=range]{ width:100%; }
  .controls-foot{ display:flex; justify-content:flex-end; margin-top:6px; }

  .save-bar{
    position:sticky; bottom:0; background:var(--cream); padding:16px 0 4px;
    display:flex; align-items:center; gap:14px; border-top:1px solid var(--line); margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Foto's herpositioneren &amp; zoomen</h1>
  <p class="sub">Pas hier aan hoe de drie foto's in de "Actueel"-sectie van de website getoond worden. Wijzigingen zijn meteen zichtbaar voor iedereen zodra je op "Opslaan" klikt.</p>

  <div class="gate">
    <input type="password" id="pw" placeholder="Beheerwachtwoord" autocomplete="off">
    <button type="button" id="unlockBtn">Ontgrendelen</button>
    <span class="status" id="gateStatus"></span>
  </div>

  <fieldset id="editor" disabled>
    <div id="cards"></div>

    <div class="save-bar">
      <button type="button" class="save-btn" id="saveBtn">Alles opslaan</button>
      <span class="status" id="saveStatus"></span>
    </div>
  </fieldset>
</div>

<script>
  const PHOTOS = [
    { key: "hero", label: "Hero (bovenaan, naast “Van script naar scherm”)", ratio: "6/5" },
    { key: "actueel-1", label: "Actueel — foto 1", ratio: "4/5" },
    { key: "actueel-2", label: "Actueel — foto 2", ratio: "4/5" },
    { key: "actueel-3", label: "Actueel — foto 3", ratio: "4/5" },
  ];
  const state = {};
  let password = "";

  const cardsEl = document.getElementById("cards");
  const editorEl = document.getElementById("editor");
  const gateStatus = document.getElementById("gateStatus");
  const saveStatus = document.getElementById("saveStatus");

  function buildCard(photo) {
    const key = photo.key;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="preview-frame" id="frame-${key}" style="aspect-ratio:${photo.ratio};">
        <img id="img-${key}" src="images/${key}.jpg" alt=""
             onerror="this.style.display='none'; document.getElementById('empty-${key}').style.display='flex';">
        <div class="empty" id="empty-${key}" style="display:none;">Nog geen foto met deze naam gevonden (${key}.jpg)</div>
      </div>
      <div class="controls">
        <h2>${photo.label}</h2>
        <p class="fname">images/${key}.jpg</p>
        <div class="slider-row">
          <label>Horizontale positie <output id="out-x-${key}"></output></label>
          <input type="range" min="0" max="100" id="x-${key}">
        </div>
        <div class="slider-row">
          <label>Verticale positie <output id="out-y-${key}"></output></label>
          <input type="range" min="0" max="100" id="y-${key}">
        </div>
        <div class="slider-row">
          <label>Zoom <output id="out-zoom-${key}"></output></label>
          <input type="range" min="100" max="300" id="zoom-${key}">
        </div>
        <div class="controls-foot">
          <button type="button" class="reset-btn" data-reset="${key}">Terugzetten</button>
        </div>
      </div>
    `;
    cardsEl.appendChild(card);

    card.querySelector(`[data-reset="${key}"]`).addEventListener("click", () => {
      applySettings(key, { x: 50, y: 50, zoom: 100 });
    });
    ["x", "y", "zoom"].forEach((axis) => {
      document.getElementById(`${axis}-${key}`).addEventListener("input", (e) => {
        state[key][axis] = Number(e.target.value);
        renderPreview(key);
      });
    });
  }

  function applySettings(key, s) {
    state[key] = { x: s.x, y: s.y, zoom: s.zoom };
    document.getElementById(`x-${key}`).value = s.x;
    document.getElementById(`y-${key}`).value = s.y;
    document.getElementById(`zoom-${key}`).value = s.zoom;
    renderPreview(key);
  }

  function renderPreview(key) {
    const s = state[key];
    document.getElementById(`out-x-${key}`).textContent = s.x + "%";
    document.getElementById(`out-y-${key}`).textContent = s.y + "%";
    document.getElementById(`out-zoom-${key}`).textContent = s.zoom + "%";
    const img = document.getElementById(`img-${key}`);
    img.style.objectPosition = s.x + "% " + s.y + "%";
    img.style.transform = "scale(" + (s.zoom / 100) + ")";
    img.style.transformOrigin = s.x + "% " + s.y + "%";
  }

  PHOTOS.forEach(buildCard);

  async function loadSettings() {
    try {
      const res = await fetch("/api/image-settings");
      if (!res.ok) throw new Error("kon instellingen niet ophalen");
      const settings = await res.json();
      PHOTOS.forEach((photo) => {
        applySettings(photo.key, settings[photo.key] || { x: 50, y: 50, zoom: 100 });
      });
    } catch (err) {
      PHOTOS.forEach((photo) => applySettings(photo.key, { x: 50, y: 50, zoom: 100 }));
      gateStatus.textContent = "Kon huidige instellingen niet laden (functie nog niet live?).";
      gateStatus.className = "status err";
    }
  }
  loadSettings();

  document.getElementById("unlockBtn").addEventListener("click", () => {
    password = document.getElementById("pw").value;
    if (!password) {
      gateStatus.textContent = "Vul een wachtwoord in.";
      gateStatus.className = "status err";
      return;
    }
    editorEl.disabled = false;
    gateStatus.textContent = "Ontgrendeld — vergeet niet op te slaan na het aanpassen.";
    gateStatus.className = "status ok";
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    saveStatus.textContent = "Bezig met opslaan...";
    saveStatus.className = "status";
    try {
      const res = await fetch("/api/image-settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password, settings: state }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Opslaan mislukt.");
      saveStatus.textContent = "Opgeslagen! De website toont dit nu automatisch.";
      saveStatus.className = "status ok";
    } catch (err) {
      saveStatus.textContent = err.message || "Er ging iets mis.";
      saveStatus.className = "status err";
    }
  });
</script>
</body>
</html>
